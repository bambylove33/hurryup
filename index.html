<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>마감보드</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    /* 헤더 */
    header {
      background: var(--card-bg);
      padding: 0.8rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 1rem; }
    .header-left h1 { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
    .btn-postype {
      background-color: #ff3b5c;
      color: white;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .header-actions { display: flex; gap: 0.4rem; }

    /* 메인 뷰포트 (3열 레이아웃) */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 360px 1fr 1.2fr;
      height: calc(100vh - 55px);
      overflow: hidden;
    }

    /* 패널 공통 */
    .panel {
      background: var(--card-bg);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    .panel-header {
      padding: 0.75rem 1rem;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body {
      padding: 0.8rem;
      overflow-y: auto;
      flex: 1;
    }

    /* 캘린더 */
    .cal-nav { display: flex; gap: 0.3rem; }
    .btn-sm {
      background: white; border: 1px solid var(--border);
      padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem;
    }
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-top: 0.5rem; }
    .cal-day-name { text-align: center; font-size: 0.75rem; font-weight: bold; color: var(--text-muted); padding: 4px 0; }
    .cal-cell {
      min-height: 52px; border: 1px solid #f1f5f9; border-radius: 4px; padding: 2px;
      font-size: 0.75rem; display: flex; flex-direction: column; justify-content: flex-start;
      background: #ffffff; overflow: hidden;
    }
    .cal-cell.today { border-color: var(--primary); font-weight: bold; }
    .cal-tags { display: flex; flex-direction: column; gap: 2px; margin-top: 2px; }
    .cal-tag {
      font-size: 0.65rem; color: white; padding: 1px 3px; border-radius: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* 마감 목록 */
    .project-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem;
      margin-bottom: 0.8rem; background: #ffffff; display: flex; flex-direction: column; gap: 0.5rem;
      border-left-width: 6px;
    }
    .project-card.uploaded { opacity: 0.6; }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: white; }
    .toggle-switch { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; cursor: pointer; }

    /* 콘티 탐색기 */
    .explorer-container { display: flex; height: 100%; }
    .tree-view { width: 160px; border-right: 1px solid var(--border); background: #f8fafc; padding: 0.5rem; overflow-y: auto; }
    .file-list { width: 140px; border-right: 1px solid var(--border); padding: 0.5rem; overflow-y: auto; }
    .file-editor { flex: 1; display: flex; flex-direction: column; padding: 0.5rem; }
    .tree-item, .file-item {
      padding: 0.3rem 0.5rem; font-size: 0.8rem; border-radius: 4px;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tree-item:hover, .file-item:hover { background: #e2e8f0; }
    .tree-item.active, .file-item.active { background: #cbd5e1; font-weight: bold; }
    .file-editor textarea {
      flex: 1; width: 100%; border: 1px solid var(--border); border-radius: 6px;
      padding: 0.8rem; font-size: 0.9rem; resize: none; outline: none; font-family: monospace;
    }

    /* 요일 선택 */
    .weekday-selector { display: flex; gap: 4px; margin-top: 4px; }
    .weekday-btn {
      flex: 1; text-align: center; padding: 4px 0; font-size: 0.75rem; border: 1px solid var(--border);
      border-radius: 4px; cursor: pointer; background: white; user-select: none;
    }
    .weekday-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }

    /* 모달 */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center;
    }
    .modal-box { background: white; padding: 1.2rem; border-radius: 8px; width: 90%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group label { font-size: 0.8rem; font-weight: bold; color: var(--text-muted); }
    .form-group input, .form-group select { padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; }

    @media (max-width: 900px) {
      .dashboard-layout { display: flex; flex-direction: column; height: auto; overflow: visible; }
      .panel { border-right: none; border-bottom: 1px solid var(--border); height: 500px; }
    }
  </style>
</head>
<body>

  <!-- 헤더 -->
  <header>
    <div class="header-left">
      <h1>마감합시다</h1>
      <a href="https://postype.com" target="_blank" class="btn-postype">포스타입 업로드 바로가기 ↗</a>
    </div>
    <div class="header-actions">
      <button class="btn-sm" onclick="exportData()">데이터 백업(JSON)</button>
      <button class="btn-sm" onclick="importData()">데이터 복원</button>
      <input type="file" id="fileInput" style="display:none" onchange="handleFile(event)">
    </div>
  </header>

  <!-- 3단 대시보드 레이아웃 -->
  <main class="dashboard-layout">
    
    <!-- 1단: 캘린더 -->
    <section class="panel">
      <div class="panel-header">
        <span id="calTitle">캘린더</span>
        <div class="cal-nav">
          <button class="btn-sm" onclick="changeMonth(-1)">&lt;</button>
          <button class="btn-sm" onclick="changeMonth(1)">&gt;</button>
        </div>
      </div>
      <div class="panel-body">
        <div style="font-size:0.8rem; margin-bottom:0.5rem;">오늘의 작성량: <strong id="todayCharSum" style="color:var(--primary);">0</strong>자</div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </section>

    <!-- 2단: 마감 목록 -->
    <section class="panel">
      <div class="panel-header">
        <span>마감 목록</span>
        <button class="btn-sm" style="background:var(--primary); color:white;" onclick="openProjectModal()">+ 마감 추가</button>
      </div>
      <div class="panel-body" id="projectList"></div>
    </section>

    <!-- 3단: 콘티 관리자 -->
    <section class="panel">
      <div class="panel-header">
        <span>콘티 탐색기</span>
        <div>
          <button class="btn-sm" onclick="createContiFile()">+ 새 파일</button>
          <button class="btn-sm" onclick="deleteContiFile()">삭제</button>
        </div>
      </div>
      <div class="explorer-container">
        <div class="tree-view" id="treeView"></div>
        <div class="file-list" id="fileList"></div>
        <div class="file-editor">
          <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;" id="currentEditingPath">파일을 선택해 주십시오.</div>
          <textarea id="contiEditor" placeholder="작성한 내용은 실시간으로 자동 저장됩니다."></textarea>
        </div>
      </div>
    </section>

  </main>

  <!-- 마감 등록/수정 모달 -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal-box">
      <h3 id="modalHead" style="margin-bottom:1rem; font-size:1.1rem;">마감 등록</h3>
      <input type="hidden" id="editProjId">
      
      <div class="form-group">
        <label>글 제목 (시리즈명)</label>
        <input type="text" id="mTitle" placeholder="예: 나의 작품">
      </div>
      <div class="form-group">
        <label>분류</label>
        <select id="mType" onchange="toggleTypeFields()">
          <option value="단편">단편</option>
          <option value="장편">장편(자유형)</option>
          <option value="정기">장편(주기형)</option>
        </select>
      </div>

      <div class="form-group" id="epGroup" style="display:none;">
        <label>현재 회차 번호</label>
        <input type="number" id="mEpisode" placeholder="예: 1">
      </div>

      <!-- 정기 연재 세부 옵션 -->
      <div id="recurringGroup" style="display:none; background:#f8fafc; border:1px solid var(--border); border-radius:6px; padding:0.6rem; margin-bottom:0.8rem;">
        <div class="form-group" style="margin-bottom:0.5rem;">
          <label>연재 방식</label>
          <select id="mRecurMode" onchange="toggleRecurMode()">
            <option value="weekly">요일 지정</option>
            <option value="interval">간격 지정</option>
            <option value="monthly">특정일 지정</option>
          </select>
        </div>

        <div class="form-group" id="recurDaysGroup" style="margin-bottom:0.4rem;">
          <label>연재 요일 선택</label>
          <div class="weekday-selector">
            <div class="weekday-btn" data-day="0" onclick="toggleWeekday(this)">일</div>
            <div class="weekday-btn" data-day="1" onclick="toggleWeekday(this)">월</div>
            <div class="weekday-btn" data-day="2" onclick="toggleWeekday(this)">화</div>
            <div class="weekday-btn" data-day="3" onclick="toggleWeekday(this)">수</div>
            <div class="weekday-btn" data-day="4" onclick="toggleWeekday(this)">목</div>
            <div class="weekday-btn" data-day="5" onclick="toggleWeekday(this)">금</div>
            <div class="weekday-btn" data-day="6" onclick="toggleWeekday(this)">토</div>
          </div>
        </div>

        <div class="form-group" id="recurIntervalGroup" style="display:none; margin-bottom:0.4rem;">
          <label>연재 간격 (일 단위)</label>
          <input type="number" id="mRecurInterval" placeholder="" min="1">
        </div>

        <div class="form-group" id="recurMonthlyGroup" style="display:none; margin-bottom:0.4rem;">
          <label>매월 연재일 (쉼표로 구분해 여러 날짜 입력)</label>
          <input type="text" id="mRecurMonthDays" placeholder="">
        </div>
      </div>

      <div class="form-group">
        <label>마감 예정일</label>
        <input type="date" id="mDueDate">
      </div>
      <div class="form-group">
        <label>예상 글자 수 (회차당 분량)</label>
        <input type="number" id="mTargetChars" placeholder="예: 5000">
      </div>
      <div class="form-group">
        <label>식별 라벨 색상</label>
        <input type="color" id="mColor" value="#4f46e5" style="height:36px; padding:2px;">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem;">
        <button class="btn-sm" onclick="closeProjectModal()">취소</button>
        <button class="btn-sm" style="background:var(--primary); color:white;" onclick="saveProject()">저장</button>
      </div>
    </div>
  </div>

  <script>
    let projects = JSON.parse(localStorage.getItem('writer_board_data')) || [];
    let calDate = new Date();
    let selectedFolderId = null;
    let selectedFileId = null;

    function saveState() {
      localStorage.setItem('writer_board_data', JSON.stringify(projects));
      renderAll();
    }

    function renderAll() {
      renderCalendar();
      renderProjects();
      renderExplorer();
    }

    /* ---------------- 다음 마감일 자동 계산 로직 ---------------- */
    function getNextDueDate(baseDateStr, recurMode, recurDays, recurInterval, recurMonthDaysStr) {
      const base = baseDateStr ? new Date(baseDateStr) : new Date();
      
      if (recurMode === 'interval') {
        const interval = parseInt(recurInterval) || 7;
        const next = new Date(base);
        next.setDate(next.getDate() + interval);
        return next.toISOString().slice(0, 10);
      } else if (recurMode === 'monthly') {
        // 쉼표로 분리된 날짜 파싱 및 정렬 (예: "1, 11, 21, 31" -> [1, 11, 21, 31])
        let days = (recurMonthDaysStr || '15')
          .split(',')
          .map(d => parseInt(d.trim()))
          .filter(d => !isNaN(d) && d >= 1 && d <= 31)
          .sort((a, b) => a - b);

        if (days.length === 0) days = [15];

        let currYear = base.getFullYear();
        let currMonth = base.getMonth();
        let currDay = base.getDate();

        // 1. 당월 남은 연재일 중 기준일보다 뒤인 날짜 탐색
        for (let targetDay of days) {
          const maxDayOfMonth = new Date(currYear, currMonth + 1, 0).getDate();
          const validDay = Math.min(targetDay, maxDayOfMonth);
          if (validDay > currDay) {
            const next = new Date(currYear, currMonth, validDay);
            return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
          }
        }

        // 2. 당월에 남은 날짜가 없으면 다음 달의 첫 번째 연재일로 지정
        let nextYear = currYear;
        let nextMonth = currMonth + 1;
        if (nextMonth > 11) {
          nextMonth = 0;
          nextYear += 1;
        }

        const maxDayOfNextMonth = new Date(nextYear, nextMonth + 1, 0).getDate();
        const firstDay = Math.min(days[0], maxDayOfNextMonth);
        const next = new Date(nextYear, nextMonth, firstDay);
        return `${next.getFullYear()}-${String(next.getMonth() + 1).padStart(2, '0')}-${String(next.getDate()).padStart(2, '0')}`;
      } else {
        // 요일 지정 연재
        if (!recurDays || recurDays.length === 0) {
          const next = new Date(base);
          next.setDate(next.getDate() + 7);
          return next.toISOString().slice(0, 10);
        }
        
        let target = new Date(base);
        for (let i = 1; i <= 14; i++) {
          target.setDate(target.getDate() + 1);
          if (recurDays.includes(target.getDay())) {
            return target.toISOString().slice(0, 10);
          }
        }
      }
      return baseDateStr;
    }

    /* ---------------- 마감 목록 및 폼 관리 ---------------- */
    function openProjectModal(id = null) {
      document.getElementById('editProjId').value = id || '';
      document.getElementById('modalHead').innerText = id ? '마감 수정' : '마감 등록';
      document.querySelectorAll('.weekday-btn').forEach(btn => btn.classList.remove('active'));

      if (id) {
        const p = projects.find(item => item.id === id);
        document.getElementById('mTitle').value = p.title;
        document.getElementById('mType').value = p.type;
        document.getElementById('mEpisode').value = p.episode || '';
        document.getElementById('mDueDate').value = p.dueDate || '';
        document.getElementById('mTargetChars').value = p.targetChars;
        document.getElementById('mColor').value = p.color || '#4f46e5';

        document.getElementById('mRecurMode').value = p.recurMode || 'weekly';
        document.getElementById('mRecurInterval').value = p.recurInterval || '';
        document.getElementById('mRecurMonthDays').value = p.recurMonthDays || '1, 11, 21, 31';
        if (p.recurDays && Array.isArray(p.recurDays)) {
          p.recurDays.forEach(d => {
            const btn = document.querySelector(`.weekday-btn[data-day="${d}"]`);
            if (btn) btn.classList.add('active');
          });
        }
      } else {
        document.getElementById('mTitle').value = '';
        document.getElementById('mType').value = '단편';
        document.getElementById('mEpisode').value = '1';
        document.getElementById('mDueDate').value = new Date().toISOString().slice(0, 10);
        document.getElementById('mTargetChars').value = '';
        document.getElementById('mColor').value = '#' + Math.floor(Math.random()*16777215).toString(16);
        document.getElementById('mRecurMode').value = 'weekly';
        document.getElementById('mRecurInterval').value = '7';
        document.getElementById('mRecurMonthDays').value = '1, 11, 21, 31';
      }
      toggleTypeFields();
      toggleRecurMode();
      document.getElementById('projectModal').style.display = 'flex';
    }

    function closeProjectModal() {
      document.getElementById('projectModal').style.display = 'none';
    }

    function toggleTypeFields() {
      const type = document.getElementById('mType').value;
      document.getElementById('epGroup').style.display = (type === '장편' || type === '정기연재') ? 'flex' : 'none';
      document.getElementById('recurringGroup').style.display = type === '정기연재' ? 'block' : 'none';
    }

    function toggleRecurMode() {
      const mode = document.getElementById('mRecurMode').value;
      document.getElementById('recurDaysGroup').style.display = mode === 'weekly' ? 'block' : 'none';
      document.getElementById('recurIntervalGroup').style.display = mode === 'interval' ? 'flex' : 'none';
      document.getElementById('recurMonthlyGroup').style.display = mode === 'monthly' ? 'flex' : 'none';
    }

    function toggleWeekday(el) {
      el.classList.toggle('active');
    }

    function saveProject() {
      const id = document.getElementById('editProjId').value;
      const title = document.getElementById('mTitle').value.trim();
      const type = document.getElementById('mType').value;
      const episode = parseInt(document.getElementById('mEpisode').value) || 1;
      let dueDate = document.getElementById('mDueDate').value;
      const targetChars = parseInt(document.getElementById('mTargetChars').value) || 0;
      const color = document.getElementById('mColor').value;

      const recurMode = document.getElementById('mRecurMode').value;
      const recurInterval = parseInt(document.getElementById('mRecurInterval').value) || 7;
      const recurMonthDays = document.getElementById('mRecurMonthDays').value.trim() || '1, 11, 21, 31';
      const selectedDays = [];
      document.querySelectorAll('.weekday-btn.active').forEach(b => {
        selectedDays.push(parseInt(b.getAttribute('data-day')));
      });

      if (!title) { alert('제목을 입력해 주십시오.'); return; }

      // 정기 연재인데 마감일이 비어있으면 다음 연재일 자동 계산
      if (type === '정기연재' && !dueDate) {
        dueDate = getNextDueDate(new Date().toISOString().slice(0,10), recurMode, selectedDays, recurInterval, recurMonthDays);
      }

      if (id) {
        const p = projects.find(item => item.id == id);
        p.title = title;
        p.type = type;
        p.episode = (type === '장편' || type === '정기연재') ? episode : null;
        p.dueDate = dueDate;
        p.targetChars = targetChars;
        p.color = color;
        p.recurMode = recurMode;
        p.recurInterval = recurInterval;
        p.recurMonthDays = recurMonthDays;
        p.recurDays = selectedDays;
      } else {
        projects.push({
          id: Date.now(),
          title,
          type,
          episode: (type === '장편' || type === '정기연재') ? episode : null,
          dueDate,
          targetChars,
          color,
          recurMode,
          recurInterval,
          recurMonthDays,
          recurDays: selectedDays,
          isUploaded: false,
          logs: [],
          files: [{ id: Date.now(), name: '콘티.txt', content: '' }]
        });
      }

      closeProjectModal();
      saveState();
    }

    function toggleUpload(id) {
      const p = projects.find(item => item.id === id);
      p.isUploaded = !p.isUploaded;

      // 정기 연재 프로젝트 업로드 완료 시 -> 다음 마감일 및 다음 회차로 자동 갱신
      if (p.isUploaded && p.type === '정기연재') {
        setTimeout(() => {
          if (confirm(`'${p.title}' ${p.episode}화 업로드가 완료되었습니다. 다음 회차(${p.episode + 1}화) 마감으로 자동 갱신할까요?`)) {
            p.episode = (p.episode || 1) + 1;
            p.dueDate = getNextDueDate(p.dueDate, p.recurMode, p.recurDays, p.recurInterval, p.recurMonthDays);
            p.isUploaded = false;
            
            p.files.push({ id: Date.now(), name: `콘티_${p.episode}화.txt`, content: '' });
            saveState();
          }
        }, 200);
      }

      saveState();
    }

    function deleteProject(id) {
      if (confirm('이 마감 프로젝트를 삭제할까요?')) {
        projects = projects.filter(item => item.id !== id);
        if (selectedFolderId === id) { selectedFolderId = null; selectedFileId = null; }
        saveState();
      }
    }

    function logProjectChars(id) {
      const input = document.getElementById(`log_input_${id}`);
      const val = parseInt(input.value);
      if (!val) return;

      const p = projects.find(item => item.id === id);
      const today = new Date().toISOString().slice(0, 10);
      const log = p.logs.find(l => l.date === today);

      if (log) log.chars += val;
      else p.logs.push({ date: today, chars: val });

      input.value = '';
      saveState();
    }

    function renderProjects() {
      const container = document.getElementById('projectList');
      container.innerHTML = '';

      projects.forEach(p => {
        const totalChars = p.logs.reduce((sum, l) => sum + l.chars, 0);
        const rate = Math.min(100, (totalChars / p.targetChars) * 100 || 0).toFixed(1);
        
        let dday = '기한 없음';
        if (p.dueDate) {
          const diff = Math.ceil((new Date(p.dueDate) - new Date(new Date().toISOString().slice(0,10))) / (1000 * 60 * 60 * 24));
          dday = diff === 0 ? 'D-Day' : (diff < 0 ? `D+${Math.abs(diff)}` : `D-${diff}`);
        }

        const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
        let recurDesc = '';
        if (p.type === '정기연재') {
          if (p.recurMode === 'weekly' && p.recurDays) {
            recurDesc = ` [매주 ${p.recurDays.map(d => dayNames[d]).join(',')}]`;
          } else if (p.recurMode === 'interval') {
            recurDesc = ` [${p.recurInterval}일 주기]`;
          } else if (p.recurMode === 'monthly') {
            recurDesc = ` [매월 ${p.recurMonthDays || '15'}일]`;
          }
        }

        const card = document.createElement('div');
        card.className = `project-card ${p.isUploaded ? 'uploaded' : ''}`;
        card.style.borderLeftColor = p.color;
        card.innerHTML = `
          <div class="card-top">
            <div>
              <span class="badge" style="background:${p.color}">${p.type}${p.episode ? ` ${p.episode}화` : ''}</span>
              <strong style="margin-left:4px;">${p.title}</strong>
              <span style="font-size:0.7rem; color:var(--text-muted);">${recurDesc}</span>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" ${p.isUploaded ? 'checked' : ''} onchange="toggleUpload(${p.id})">
              <span>${p.isUploaded ? '업로드 완료' : '미완료'}</span>
            </label>
          </div>

          <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted);">
            <span>마감일: ${p.dueDate || '미정'} (${dday})</span>
            <span>${totalChars.toLocaleString()} / ${p.targetChars.toLocaleString()}자 (${rate}%)</span>
          </div>

          <div style="display:flex; justify-content:space-between; align-items:center; gap:0.5rem; margin-top:4px;">
            <div style="display:flex; gap:3px;">
              <input type="number" id="log_input_${p.id}" style="width:70px; padding:2px 4px; font-size:0.75rem;" placeholder="분량">
              <button class="btn-sm" onclick="logProjectChars(${p.id})">기록</button>
            </div>
            <div>
              <button class="btn-sm" onclick="openProjectModal(${p.id})">수정</button>
              <button class="btn-sm" style="color:var(--danger);" onclick="deleteProject(${p.id})">삭제</button>
            </div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* ---------------- 캘린더 ---------------- */
    function changeMonth(delta) {
      calDate.setMonth(calDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const y = calDate.getFullYear();
      const m = calDate.getMonth();
      document.getElementById('calTitle').innerText = `${y}년 ${m + 1}월`;

      ['일','월','화','수','목','금','토'].forEach(d => {
        grid.innerHTML += `<div class="cal-day-name">${d}</div>`;
      });

      const firstDay = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();
      const todayStr = new Date().toISOString().slice(0, 10);

      for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

      let todaySum = 0;

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        let tagsHtml = '';

        projects.forEach(p => {
          const l = p.logs.find(log => log.date === dateStr);
          if (l) {
            tagsHtml += `<div class="cal-tag" style="background:${p.color}">+${l.chars}자</div>`;
            if (dateStr === todayStr) todaySum += l.chars;
          }
          if (p.dueDate === dateStr) {
            tagsHtml += `<div class="cal-tag" style="background:${p.color}; outline:1px solid #000;">[마감] ${p.title}${p.episode ? ` ${p.episode}화` : ''}</div>`;
          }
        });

        grid.innerHTML += `
          <div class="cal-cell ${dateStr === todayStr ? 'today' : ''}">
            <span>${d}</span>
            <div class="cal-tags">${tagsHtml}</div>
          </div>
        `;
      }

      document.getElementById('todayCharSum').innerText = todaySum.toLocaleString();
    }

    /* ---------------- 콘티 디렉토리 탐색기 ---------------- */
    function renderExplorer() {
      const tree = document.getElementById('treeView');
      const files = document.getElementById('fileList');
      tree.innerHTML = '';
      files.innerHTML = '';

      if (projects.length === 0) {
        document.getElementById('currentEditingPath').innerText = '생성된 프로젝트가 없습니다.';
        document.getElementById('contiEditor').value = '';
        return;
      }

      if (!selectedFolderId || !projects.some(p => p.id === selectedFolderId)) {
        selectedFolderId = projects[0].id;
      }

      projects.forEach(p => {
        const item = document.createElement('div');
        item.className = `tree-item ${p.id === selectedFolderId ? 'active' : ''}`;
        item.innerHTML = `📁 ${p.title}`;
        item.onclick = () => { selectedFolderId = p.id; selectedFileId = null; renderExplorer(); };
        tree.appendChild(item);
      });

      const currentProj = projects.find(p => p.id === selectedFolderId);
      if (currentProj) {
        if (!currentProj.files) currentProj.files = [];
        if (currentProj.files.length > 0 && !selectedFileId) {
          selectedFileId = currentProj.files[0].id;
        }

        currentProj.files.forEach(f => {
          const fItem = document.createElement('div');
          fItem.className = `file-item ${f.id === selectedFileId ? 'active' : ''}`;
          fItem.innerHTML = `📄 ${f.name}`;
          fItem.onclick = () => { selectedFileId = f.id; renderExplorer(); };
          files.appendChild(fItem);
        });

        const currentFile = currentProj.files.find(f => f.id === selectedFileId);
        if (currentFile) {
          document.getElementById('currentEditingPath').innerText = `${currentProj.title} > ${currentFile.name}`;
          document.getElementById('contiEditor').value = currentFile.content || '';
        } else {
          document.getElementById('currentEditingPath').innerText = '선택된 파일이 없습니다.';
          document.getElementById('contiEditor').value = '';
        }
      }
    }

    function createContiFile() {
      if (!selectedFolderId) return;
      const name = prompt('생성할 콘티 파일명을 입력하십시오:', '새콘티.txt');
      if (!name) return;

      const p = projects.find(item => item.id === selectedFolderId);
      const newFile = { id: Date.now(), name, content: '' };
      p.files.push(newFile);
      selectedFileId = newFile.id;
      saveState();
    }

    function deleteContiFile() {
      if (!selectedFolderId || !selectedFileId) return;
      const p = projects.find(item => item.id === selectedFolderId);
      if (confirm('선택한 파일을 삭제할까요?')) {
        p.files = p.files.filter(f => f.id !== selectedFileId);
        selectedFileId = null;
        saveState();
      }
    }

    document.getElementById('contiEditor').addEventListener('input', (e) => {
      if (!selectedFolderId || !selectedFileId) return;
      const p = projects.find(item => item.id === selectedFolderId);
      const f = p.files.find(file => file.id === selectedFileId);
      if (f) {
        f.content = e.target.value;
        localStorage.setItem('writer_board_data', JSON.stringify(projects));
      }
    });

    /* ---------------- 데이터 백업 및 복원 ---------------- */
    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `마감보드_백업_${new Date().toISOString().slice(0,10)}.json`);
      a.click();
    }

    function importData() {
      document.getElementById('fileInput').click();
    }

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          projects = JSON.parse(event.target.result);
          saveState();
          alert('데이터를 성공적으로 복원했습니다.');
        } catch (err) {
          alert('올바른 JSON 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    window.onload = renderAll;
  </script>
</body>
</html>
