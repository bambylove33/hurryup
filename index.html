<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>마감보드</title>
  <style>
    :root {
      --bg: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --success: #10b981;
      --danger: #ef4444;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #cbd5e1;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    header {
      background: var(--card-bg);
      padding: 0.6rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
    }
    .header-left { display: flex; align-items: center; gap: 1.2rem; }
    .header-left h1 { font-size: 1.2rem; font-weight: 900; color: var(--primary); }
    .header-clock {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--text);
      background: #f8fafc;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .btn-postype {
      background-color: #ff3b5c;
      color: white;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: bold;
      padding: 0.4rem 0.8rem;
      border-radius: 6px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .header-actions { display: flex; gap: 0.4rem; }

    .dashboard-layout {
      display: flex;
      width: 100vw;
      height: calc(100vh - 55px);
      overflow: hidden;
    }

    .panel {
      background: var(--card-bg);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }
    
    #panel1 { width: 780px; min-width: 320px; flex-shrink: 0; }
    #panel2 { width: 450px; min-width: 300px; flex-shrink: 0; }
    #panel3 { flex: 1; min-width: 350px; }

    .resizer {
      width: 6px;
      background: var(--border);
      cursor: col-resize;
      user-select: none;
      transition: background 0.2s;
      flex-shrink: 0;
      z-index: 10;
    }
    .resizer:hover, .resizer.dragging {
      background: var(--primary);
    }

    .panel-header {
      padding: 0.75rem 1rem;
      background: #f8fafc;
      border-bottom: 1px solid var(--border);
      font-weight: bold;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-body {
      padding: 0.8rem;
      overflow-y: auto;
      flex: 1;
    }

    .cal-nav { display: flex; gap: 0.3rem; }
    .btn-sm {
      background: white; border: 1px solid var(--border);
      padding: 0.25rem 0.5rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem;
    }
    .btn-danger { color: var(--danger); }
    
    .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 0.5rem; }
    .cal-day-name { text-align: center; font-size: 0.75rem; font-weight: bold; color: #000000; padding: 4px 0; }
    .cal-cell {
      min-height: 80px; border: 1px solid #f1f5f9; border-radius: 4px; padding: 4px;
      font-size: 0.75rem; display: flex; flex-direction: column; justify-content: flex-start;
      background: #ffffff; overflow: hidden; color: #000000; font-weight: 600;
    }
    .cal-cell.today { border-color: var(--primary); font-weight: bold; }
    .cal-tags { display: flex; flex-direction: column; gap: 2px; margin-top: 3px; overflow-y: auto; max-height: 60px; }
    .cal-tag {
      font-size: 0.65rem; color: #000000; font-weight: bold; padding: 2px 4px; border-radius: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .project-card {
      border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem;
      margin-bottom: 0.8rem; background: #ffffff; display: flex; flex-direction: column; gap: 0.5rem;
      border-left-width: 6px;
    }
    .project-card.uploaded { opacity: 0.6; }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .badge { font-size: 0.7rem; padding: 2px 6px; border-radius: 4px; font-weight: bold; color: white; }
    .toggle-switch { display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; cursor: pointer; }

    .timer-section {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.8rem;
      margin-top: 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      flex-shrink: 0;
    }
    .timer-display {
      font-size: 1.6rem;
      font-weight: 900;
      text-align: center;
      font-family: monospace;
      color: var(--primary);
      background: #ffffff;
      padding: 0.4rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }
    .timer-controls {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
    }
    .timer-summary {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 1.1rem;
    }

    .explorer-container { display: flex; height: 100%; }
    .tree-view { width: 160px; border-right: 1px solid var(--border); background: #f8fafc; padding: 0.5rem; overflow-y: auto; }
    .file-list { width: 140px; border-right: 1px solid var(--border); padding: 0.5rem; overflow-y: auto; }
    .file-editor { flex: 1; display: flex; flex-direction: column; padding: 0.5rem; }
    .tree-item, .file-item {
      padding: 0.3rem 0.5rem; font-size: 0.8rem; border-radius: 4px;
      cursor: pointer; display: flex; align-items: center; gap: 4px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .tree-item:hover, .file-item:hover { background: #e2e8f0; }
    .tree-item.active, .file-item.active { background: #cbd5e1; font-weight: bold; }
    .file-editor textarea {
      flex: 1; width: 100%; border: 1px solid var(--border); border-radius: 6px;
      padding: 0.8rem; font-size: 0.9rem; resize: none; outline: none; font-family: monospace;
    }

    .weekday-selector { display: flex; gap: 4px; margin-top: 4px; }
    .weekday-btn {
      flex: 1; text-align: center; padding: 4px 0; font-size: 0.75rem; border: 1px solid var(--border);
      border-radius: 4px; cursor: pointer; background: white; user-select: none;
    }
    .weekday-btn.active { background: var(--primary); color: white; border-color: var(--primary); font-weight: bold; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center;
    }
    .modal-box { background: white; padding: 1.2rem; border-radius: 8px; width: 90%; max-width: 440px; max-height: 90vh; overflow-y: auto; }
    .form-group { display: flex; flex-direction: column; gap: 0.3rem; margin-bottom: 0.8rem; }
    .form-group label { font-size: 0.8rem; font-weight: bold; color: var(--text-muted); }
    .form-group input, .form-group select { padding: 0.5rem; border: 1px solid var(--border); border-radius: 4px; }
    .flex-row { display: flex; gap: 0.5rem; }

    @media (max-width: 900px) {
      .dashboard-layout { display: flex; flex-direction: column; height: auto; overflow: visible; }
      .panel { border-right: none; border-bottom: 1px solid var(--border); height: 500px; width: 100% !important; }
      .resizer { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <h1>마감합시다</h1>
      <a href="https://postype.com" target="_blank" class="btn-postype">포스타입 업로드 바로가기 ↗</a>
      <div class="header-clock" id="liveClock">0000-00-00 (월) 00:00:00</div>
    </div>
    <div class="header-actions">
      <button class="btn-sm btn-danger" onclick="resetAllData()">데이터 초기화</button>
      <button class="btn-sm" onclick="exportData()">데이터 백업(JSON)</button>
      <button class="btn-sm" onclick="importData()">데이터 복원</button>
      <input type="file" id="fileInput" style="display:none" onchange="handleFile(event)">
    </div>
  </header>

  <main class="dashboard-layout" id="dashboardLayout">
    <!-- 1단: 캘린더 -->
    <section class="panel" id="panel1">
      <div class="panel-header">
        <span id="calTitle" style="color:#000000;">캘린더</span>
        <div class="cal-nav">
          <button class="btn-sm" onclick="changeMonth(-1)">&lt;</button>
          <button class="btn-sm" onclick="changeMonth(1)">&gt;</button>
        </div>
      </div>
      <div class="panel-body">
        <div style="font-size:0.8rem; margin-bottom:0.5rem; color:#000000;">오늘의 작성량: <strong id="todayCharSum" style="color:var(--primary);">0</strong>자</div>
        <div class="calendar-grid" id="calendarGrid"></div>
      </div>
    </section>

    <!-- 구분선 1 -->
    <div class="resizer" id="resizer1"></div>

    <!-- 2단: 마감 목록 및 마감 타이머 -->
    <section class="panel" id="panel2">
      <div class="panel-header">
        <span>마감 목록</span>
        <button class="btn-sm" style="background:var(--primary); color:white;" onclick="openProjectModal()">+ 마감 등록</button>
      </div>
      <div class="panel-body" style="display:flex; flex-direction:column; gap:0.6rem; overflow:hidden;">
        <div id="projectList" style="flex:1; overflow-y:auto; padding-right:2px;"></div>

        <!-- 마감 타이머 -->
        <div class="timer-section">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <strong style="font-size:0.85rem; color:var(--text);">⏱️ 마감 타이머</strong>
            <select id="timerProjSelect" style="font-size:0.75rem; padding:3px 6px; border:1px solid var(--border); border-radius:4px; max-width:200px;">
              <option value="">작품 선택...</option>
            </select>
          </div>
          <div class="timer-display" id="timerDisplay">00:00:00</div>
          <div class="timer-controls">
            <button class="btn-sm" id="btnTimerStart" style="background:var(--primary); color:white;" onclick="startTimer()">시작</button>
            <button class="btn-sm" id="btnTimerPause" onclick="pauseTimer()" disabled>일시정지</button>
            <button class="btn-sm btn-danger" id="btnTimerStop" onclick="stopTimer()" disabled>종료</button>
          </div>
          <div class="timer-summary" id="timerSummary">진행할 작품을 선택하고 시작을 눌러 주십시오.</div>
        </div>
      </div>
    </section>

    <!-- 구분선 2 -->
    <div class="resizer" id="resizer2"></div>

    <!-- 3단: 콘티 탐색기 -->
    <section class="panel" id="panel3">
      <div class="panel-header">
        <span>콘티 탐색기</span>
        <div>
          <button class="btn-sm" onclick="createContiFile()">+ 새 파일</button>
          <button class="btn-sm" onclick="deleteContiFile()">삭제</button>
        </div>
      </div>
      <div class="explorer-container">
        <div class="tree-view" id="treeView"></div>
        <div class="file-list" id="fileList"></div>
        <div class="file-editor">
          <div style="font-size:0.75rem; color:var(--text-muted); margin-bottom:4px;" id="currentEditingPath">파일을 선택해 주십시오.</div>
          <textarea id="contiEditor" placeholder="작성한 내용은 실시간으로 자동 저장됩니다."></textarea>
        </div>
      </div>
    </section>
  </main>

  <!-- 마감 등록/수정 모달 -->
  <div class="modal-overlay" id="projectModal">
    <div class="modal-box">
      <h3 id="modalHead" style="margin-bottom:1rem; font-size:1.1rem;">마감 등록</h3>
      <input type="hidden" id="editProjId">

      <div class="form-group" id="existSelectGroup" style="display:none;">
        <label>작업 선택 (장편 수정 시)</label>
        <select id="mExistProj" onchange="loadSelectedLongProject(this.value)">
          <option value="">새 장편 프로젝트 등록</option>
        </select>
      </div>
      
      <div class="form-group">
        <label>글 제목 (시리즈명)</label>
        <input type="text" id="mTitle" placeholder="예: 나의 작품">
      </div>
      <div class="form-group">
        <label>분류</label>
        <select id="mType" onchange="toggleTypeFields()">
          <option value="단편">단편</option>
          <option value="장편(자유형)">장편 (자유형 - 수동 마감)</option>
          <option value="장편(주기형)">장편 (주기형 - 자동 주기 계산)</option>
        </select>
      </div>

      <div id="epGroup" style="display:none;">
        <div class="flex-row">
          <div class="form-group" style="flex:1;">
            <label>현재 회차</label>
            <input type="number" id="mEpisode" placeholder="1" min="1">
          </div>
          <div class="form-group" id="finalEpGroup" style="flex:1;">
            <label>완결 예정 회차</label>
            <input type="number" id="mFinalEpisode" placeholder="예: 40" min="1">
          </div>
        </div>
      </div>

      <div id="recurringGroup" style="display:none; background:#f8fafc; border:1px solid var(--border); border-radius:6px; padding:0.6rem; margin-bottom:0.8rem;">
        <div class="form-group" style="margin-bottom:0.5rem;">
          <label>연재 방식</label>
          <select id="mRecurMode" onchange="toggleRecurMode()">
            <option value="weekly">요일 지정 연재 (예: 매주 월/목)</option>
            <option value="interval">간격 연재 (예: 3일마다, 7일마다)</option>
            <option value="monthly">매월 특정일 연재 (예: 1, 11, 21, 31일)</option>
          </select>
        </div>

        <div class="form-group" id="recurDaysGroup" style="margin-bottom:0.4rem;">
          <label>연재 요일 선택</label>
          <div class="weekday-selector">
            <div class="weekday-btn" data-day="0" onclick="toggleWeekday(this)">일</div>
            <div class="weekday-btn" data-day="1" onclick="toggleWeekday(this)">월</div>
            <div class="weekday-btn" data-day="2" onclick="toggleWeekday(this)">화</div>
            <div class="weekday-btn" data-day="3" onclick="toggleWeekday(this)">수</div>
            <div class="weekday-btn" data-day="4" onclick="toggleWeekday(this)">목</div>
            <div class="weekday-btn" data-day="5" onclick="toggleWeekday(this)">금</div>
            <div class="weekday-btn" data-day="6" onclick="toggleWeekday(this)">토</div>
          </div>
        </div>

        <div class="form-group" id="recurIntervalGroup" style="display:none; margin-bottom:0.4rem;">
          <label>연재 간격 (일 단위)</label>
          <input type="number" id="mRecurInterval" placeholder="예: 3" min="1">
        </div>

        <div class="form-group" id="recurMonthlyGroup" style="display:none; margin-bottom:0.4rem;">
          <label>매월 연재일 (쉼표로 구분)</label>
          <input type="text" id="mRecurMonthDays" placeholder="예: 1, 11, 21, 31">
        </div>
      </div>

      <div class="form-group">
        <label id="dateLabel">마감 예정일 (현재 회차 마감일)</label>
        <input type="date" id="mDueDate">
      </div>
      <div class="form-group">
        <label>회차당 목표 글자 수</label>
        <input type="number" id="mTargetChars" placeholder="예: 6000">
      </div>
      <div class="form-group">
        <label>식별 라벨 색상</label>
        <input type="color" id="mColor" value="#4f46e5" style="height:36px; padding:2px;">
      </div>

      <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem;">
        <button class="btn-sm" onclick="closeProjectModal()">취소</button>
        <button class="btn-sm" style="background:var(--primary); color:white;" onclick="saveProject()">저장</button>
      </div>
    </div>
  </div>

  <script>
    let projects = JSON.parse(localStorage.getItem('writer_board_data')) || [];
    let calDate = new Date();
    let selectedFolderId = null;
    let selectedFileId = null;

    let timerInterval = null;
    let timerStartTime = 0;
    let timerAccumulatedMs = 0;
    let isTimerRunning = false;

    function updateClock() {
      const now = new Date();
      const year = now.getFullYear();
      const month = String(now.getMonth() + 1).padStart(2, '0');
      const date = String(now.getDate()).padStart(2, '0');
      const dayNames = ['일', '월', '화', '수', '목', '금', '토'];
      const day = dayNames[now.getDay()];
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('liveClock').innerText = `${year}-${month}-${date} (${day}) ${hours}:${minutes}:${seconds}`;
    }

    function saveState() {
      localStorage.setItem('writer_board_data', JSON.stringify(projects));
      renderAll();
    }

    function renderAll() {
      renderCalendar();
      renderProjects();
      renderExplorer();
      updateTimerDropdown();
    }

    function resetAllData() {
      if (confirm("정말로 모든 마감 데이터와 콘티를 초기화하시겠습니까?")) {
        localStorage.removeItem('writer_board_data');
        projects = [];
        selectedFolderId = null;
        selectedFileId = null;
        saveState();
        alert('모든 데이터가 초기화되었습니다.');
      }
    }

    function initResizers() {
      const resizer1 = document.getElementById('resizer1');
      const resizer2 = document.getElementById('resizer2');
      const panel1 = document.getElementById('panel1');
      const panel2 = document.getElementById('panel2');

      function makeResizable(resizer, targetPanel) {
        let startX = 0;
        let startWidth = 0;

        const onMouseMove = function(e) {
          const dx = e.clientX - startX;
          const newWidth = startWidth + dx;
          if (newWidth >= 220 && newWidth < window.innerWidth - 300) {
            targetPanel.style.width = `${newWidth}px`;
          }
        };

        const onMouseUp = function() {
          resizer.classList.remove('dragging');
          document.removeEventListener('mousemove', onMouseMove);
          document.removeEventListener('mouseup', onMouseUp);
        };

        resizer.addEventListener('mousedown', function(e) {
          startX = e.clientX;
          startWidth = targetPanel.getBoundingClientRect().width;
          resizer.classList.add('dragging');
          document.addEventListener('mousemove', onMouseMove);
          document.addEventListener('mouseup', onMouseUp);
        });
      }

      if (resizer1 && panel1) makeResizable(resizer1, panel1);
      if (resizer2 && panel2) makeResizable(resizer2, panel2);
    }

    /* ---------------- 타이머 제어 ---------------- */
    function updateTimerDropdown() {
      const select = document.getElementById('timerProjSelect');
      const currentVal = select.value;
      select.innerHTML = '<option value="">작품 선택...</option>';
      projects.forEach(p => {
        let epText = p.type !== '단편' ? ` (${p.currentEpisode || 1}화)` : '';
        select.innerHTML += `<option value="${p.id}">${p.title}${epText}</option>`;
      });
      select.value = currentVal;
    }

    function formatTime(totalSec) {
      const h = String(Math.floor(totalSec / 3600)).padStart(2, '0');
      const m = String(Math.floor((totalSec % 3600) / 60)).padStart(2, '0');
      const s = String(totalSec % 60).padStart(2, '0');
      return `${h}:${m}:${s}`;
    }

    function getElapsedSeconds() {
      if (!isTimerRunning) {
        return Math.floor(timerAccumulatedMs / 1000);
      }
      const currentElapsed = Date.now() - timerStartTime;
      return Math.floor((timerAccumulatedMs + currentElapsed) / 1000);
    }

    function startTimer() {
      const projId = document.getElementById('timerProjSelect').value;
      if (!projId) {
        alert('타이머를 시작할 작품을 먼저 선택해 주십시오.');
        return;
      }

      if (!isTimerRunning) {
        isTimerRunning = true;
        timerStartTime = Date.now();

        document.getElementById('timerProjSelect').disabled = true;
        document.getElementById('btnTimerStart').disabled = true;
        document.getElementById('btnTimerPause').disabled = false;
        document.getElementById('btnTimerStop').disabled = false;

        const p = projects.find(item => item.id == projId);
        document.getElementById('timerSummary').innerText = `'${p.title}' 마감 집계 중...`;

        timerInterval = setInterval(() => {
          document.getElementById('timerDisplay').innerText = formatTime(getElapsedSeconds());
        }, 500);
      }
    }

    function pauseTimer() {
      if (isTimerRunning) {
        clearInterval(timerInterval);
        isTimerRunning = false;
        timerAccumulatedMs += (Date.now() - timerStartTime);

        document.getElementById('btnTimerStart').disabled = false;
        document.getElementById('btnTimerPause').disabled = true;
        document.getElementById('timerSummary').innerText = '타이머가 일시정지되었습니다.';
      }
    }

    function stopTimer() {
      const projId = document.getElementById('timerProjSelect').value;
      if (!projId) return;

      const totalSec = getElapsedSeconds();
      clearInterval(timerInterval);
      isTimerRunning = false;

      const p = projects.find(item => item.id == projId);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const timeDesc = h > 0 ? `${h}시간 ${m}분` : `${m}분`;

      const inputVal = prompt(`'${p.title}' 마감이 종료되었습니다.\n실제 작업 시간(${timeDesc}) 동안 작성한 글자 수를 입력해 주십시오:`, '0');
      const chars = parseInt(inputVal);

      if (!isNaN(chars) && chars > 0) {
        const today = new Date().toISOString().slice(0, 10);
        const currentEp = p.currentEpisode || 1;

        const existingLog = p.logs.find(l => l.date === today && l.episode === currentEp);
        if (existingLog) {
          existingLog.chars += chars;
        } else {
          p.logs.push({ date: today, episode: currentEp, chars: chars });
        }

        document.getElementById('timerSummary').innerText = `최근 기록: ${timeDesc} 동안 ${chars.toLocaleString()}자 작성 완료!`;
        saveState();
      } else {
        document.getElementById('timerSummary').innerText = '타이머가 기록 없이 종료되었습니다.';
      }

      timerStartTime = 0;
      timerAccumulatedMs = 0;
      document.getElementById('timerDisplay').innerText = '00:00:00';
      document.getElementById('timerProjSelect').disabled = false;
      document.getElementById('btnTimerStart').disabled = false;
      document.getElementById('btnTimerPause').disabled = true;
      document.getElementById('btnTimerStop').disabled = true;
    }

    /* ---------------- 스케줄 계산 로직 ---------------- */
    function generateSchedule(startDateStr, startEp, finalEp, recurMode, recurDays, recurInterval, recurMonthDaysStr) {
      let schedule = [];
      let sEp = parseInt(startEp) || 1;
      let fEp = parseInt(finalEp) || sEp;

      let [startYear, startMonth, startDay] = startDateStr.split('-').map(Number);
      let curr = new Date(startYear, startMonth - 1, startDay);

      schedule.push({
        episode: sEp,
        dueDate: `${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`
      });

      if (recurMode === 'monthly') {
        let days = (recurMonthDaysStr || '1, 11, 21, 31')
          .split(',')
          .map(d => parseInt(d.trim()))
          .filter(d => !isNaN(d) && d >= 1 && d <= 31)
          .sort((a, b) => a - b);
        if (days.length === 0) days = [1, 11, 21, 31];

        let ep = sEp + 1;
        let y = curr.getFullYear();
        let m = curr.getMonth();

        while (ep <= fEp) {
          const maxDayOfMonth = new Date(y, m + 1, 0).getDate();

          for (let targetDay of days) {
            if (targetDay <= maxDayOfMonth) {
              const targetDate = new Date(y, m, targetDay);
              if (targetDate > curr && ep <= fEp) {
                const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(targetDay).padStart(2, '0')}`;
                schedule.push({ episode: ep, dueDate: dateStr });
                ep++;
              }
            }
          }
          m++;
          if (m > 11) { m = 0; y++; }
        }
      } else if (recurMode === 'interval') {
        const interval = parseInt(recurInterval) || 7;
        for (let ep = sEp + 1; ep <= fEp; ep++) {
          curr.setDate(curr.getDate() + interval);
          const dateStr = `${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`;
          schedule.push({ episode: ep, dueDate: dateStr });
        }
      } else {
        if (!recurDays || recurDays.length === 0) recurDays = [1];
        for (let ep = sEp + 1; ep <= fEp; ep++) {
          while (true) {
            curr.setDate(curr.getDate() + 1);
            if (recurDays.includes(curr.getDay())) {
              const dateStr = `${curr.getFullYear()}-${String(curr.getMonth() + 1).padStart(2, '0')}-${String(curr.getDate()).padStart(2, '0')}`;
              schedule.push({ episode: ep, dueDate: dateStr });
              break;
            }
          }
        }
      }
      return schedule;
    }

    function openProjectModal(id = null) {
      document.getElementById('editProjId').value = id || '';
      document.getElementById('modalHead').innerText = id ? '마감 수정' : '마감 등록';
      document.querySelectorAll('.weekday-btn').forEach(btn => btn.classList.remove('active'));

      const existSelectGroup = document.getElementById('existSelectGroup');
      const existSelect = document.getElementById('mExistProj');
      existSelect.innerHTML = '<option value="">새 장편 프로젝트 등록</option>';

      const longProjects = projects.filter(p => p.type !== '단편');
      if (longProjects.length > 0) {
        existSelectGroup.style.display = 'block';
        longProjects.forEach(p => {
          existSelect.innerHTML += `<option value="${p.id}">${p.title} (${p.type})</option>`;
        });
      } else {
        existSelectGroup.style.display = 'none';
      }

      if (id) {
        const p = projects.find(item => item.id === id);
        existSelect.value = p.id;
        loadSelectedProjectData(p);
      } else {
        resetModalForm();
      }
      toggleTypeFields();
      toggleRecurMode();
      document.getElementById('projectModal').style.display = 'flex';
    }

    function loadSelectedLongProject(val) {
      if (!val) { resetModalForm(); return; }
      const p = projects.find(item => item.id == val);
      if (p) loadSelectedProjectData(p);
    }

    function loadSelectedProjectData(p) {
      document.getElementById('editProjId').value = p.id;
      document.getElementById('mTitle').value = p.title;
      document.getElementById('mType').value = p.type;
      document.getElementById('mEpisode').value = p.currentEpisode || p.episode || 1;
      document.getElementById('mFinalEpisode').value = p.finalEpisode || '';
      document.getElementById('mDueDate').value = p.dueDate || '';
      document.getElementById('mTargetChars').value = p.targetChars;
      document.getElementById('mColor').value = p.color || '#4f46e5';
      document.getElementById('mRecurMode').value = p.recurMode || 'weekly';
      document.getElementById('mRecurInterval').value = p.recurInterval || '7';
      document.getElementById('mRecurMonthDays').value = p.recurMonthDays || '1, 11, 21, 31';

      document.querySelectorAll('.weekday-btn').forEach(btn => btn.classList.remove('active'));
      if (p.recurDays && Array.isArray(p.recurDays)) {
        p.recurDays.forEach(d => {
          const btn = document.querySelector(`.weekday-btn[data-day="${d}"]`);
          if (btn) btn.classList.add('active');
        });
      }
      toggleTypeFields();
      toggleRecurMode();
    }

    function resetModalForm() {
      document.getElementById('mTitle').value = '';
      document.getElementById('mType').value = '단편';
      document.getElementById('mEpisode').value = '1';
      document.getElementById('mFinalEpisode').value = '';
      document.getElementById('mDueDate').value = new Date().toISOString().slice(0, 10);
      document.getElementById('mTargetChars').value = '';
      document.getElementById('mColor').value = '#' + Math.floor(Math.random()*16777215).toString(16);
      document.getElementById('mRecurMode').value = 'monthly';
      document.getElementById('mRecurInterval').value = '7';
      document.getElementById('mRecurMonthDays').value = '1, 11, 21, 31';
      toggleTypeFields();
      toggleRecurMode();
    }

    function closeProjectModal() {
      document.getElementById('projectModal').style.display = 'none';
    }

    function toggleTypeFields() {
      const type = document.getElementById('mType').value;
      const isLong = type === '장편(자유형)' || type === '장편(주기형)';
      const isRecurring = type === '장편(주기형)';

      document.getElementById('epGroup').style.display = isLong ? 'block' : 'none';
      document.getElementById('finalEpGroup').style.display = isRecurring ? 'block' : 'none';
      document.getElementById('recurringGroup').style.display = isRecurring ? 'block' : 'none';
    }

    function toggleRecurMode() {
      const mode = document.getElementById('mRecurMode').value;
      document.getElementById('recurDaysGroup').style.display = mode === 'weekly' ? 'block' : 'none';
      document.getElementById('recurIntervalGroup').style.display = mode === 'interval' ? 'block' : 'none';
      document.getElementById('recurMonthlyGroup').style.display = mode === 'monthly' ? 'block' : 'none';
    }

    function toggleWeekday(el) { el.classList.toggle('active'); }

    function saveProject() {
      const id = document.getElementById('editProjId').value;
      const title = document.getElementById('mTitle').value.trim();
      const type = document.getElementById('mType').value;
      const isLong = type !== '단편';
      const isRecurring = type === '장편(주기형)';

      const currentEp = parseInt(document.getElementById('mEpisode').value) || 1;
      const finalEp = parseInt(document.getElementById('mFinalEpisode').value) || currentEp;
      let dueDate = document.getElementById('mDueDate').value;
      const targetChars = parseInt(document.getElementById('mTargetChars').value) || 0;
      const color = document.getElementById('mColor').value;

      const recurMode = document.getElementById('mRecurMode').value;
      const recurInterval = parseInt(document.getElementById('mRecurInterval').value) || 7;
      const recurMonthDays = document.getElementById('mRecurMonthDays').value.trim() || '1, 11, 21, 31';
      const selectedDays = [];
      document.querySelectorAll('.weekday-btn.active').forEach(b => selectedDays.push(parseInt(b.getAttribute('data-day'))));

      if (!title) { alert('제목을 입력해 주십시오.'); return; }
      if (!dueDate) { alert('마감 예정일을 선택해 주십시오.'); return; }

      let schedule = [];
      if (isRecurring) {
        schedule = generateSchedule(dueDate, currentEp, finalEp, recurMode, selectedDays, recurInterval, recurMonthDays);
      }

      if (id) {
        const p = projects.find(item => item.id == id);
        p.title = title;
        p.type = type;
        p.currentEpisode = isLong ? currentEp : null;
        p.finalEpisode = isRecurring ? finalEp : null;
        p.dueDate = dueDate;
        p.targetChars = targetChars;
        p.color = color;
        p.recurMode = recurMode;
        p.recurInterval = recurInterval;
        p.recurMonthDays = recurMonthDays;
        p.recurDays = selectedDays;
        if (isRecurring) p.schedule = schedule;
      } else {
        projects.push({
          id: Date.now(),
          title,
          type,
          currentEpisode: isLong ? currentEp : null,
          finalEpisode: isRecurring ? finalEp : null,
          dueDate,
          targetChars,
          color,
          recurMode,
          recurInterval,
          recurMonthDays,
          recurDays: selectedDays,
          schedule: isRecurring ? schedule : [],
          isUploaded: false,
          logs: [],
          files: [{ id: Date.now(), name: '콘티.txt', content: '' }]
        });
      }

      closeProjectModal();
      saveState();
    }

    function toggleUpload(id) {
      const p = projects.find(item => item.id === id);
      p.isUploaded = !p.isUploaded;

      if (p.isUploaded && p.type === '장편(자유형)') {
        const nextEp = (p.currentEpisode || 1) + 1;
        setTimeout(() => {
          const nextDate = prompt(`'${p.title}' ${p.currentEpisode}화 업로드가 완료되었습니다.\n다음 회차(${nextEp}화)의 마감 예정일을 지정해 주십시오 (YYYY-MM-DD):`, new Date().toISOString().slice(0,10));
          if (nextDate) {
            p.currentEpisode = nextEp;
            p.dueDate = nextDate;
            p.isUploaded = false;
            p.files.push({ id: Date.now(), name: `콘티_${nextEp}화.txt`, content: '' });
            saveState();
          } else {
            saveState();
          }
        }, 200);
      }

      if (p.isUploaded && p.type === '장편(주기형)') {
        const nextEp = (p.currentEpisode || 1) + 1;
        if (p.finalEpisode && nextEp > p.finalEpisode) {
          alert(`'${p.title}' 완결(${p.finalEpisode}화) 마감까지 모두 완료되었습니다!`);
        } else {
          setTimeout(() => {
            if (confirm(`'${p.title}' ${p.currentEpisode}화 업로드가 완료되었습니다. 다음 회차(${nextEp}화) 마감으로 진행하시겠습니까?`)) {
              p.currentEpisode = nextEp;
              p.isUploaded = false;
              
              if (p.schedule && p.schedule.length > 0) {
                const nextItem = p.schedule.find(s => s.episode === nextEp);
                if (nextItem) p.dueDate = nextItem.dueDate;
              }
              p.files.push({ id: Date.now(), name: `콘티_${nextEp}화.txt`, content: '' });
              saveState();
            }
          }, 200);
        }
      }
      saveState();
    }

    function deleteProject(id) {
      if (confirm('이 마감 프로젝트를 삭제하시겠습니까?')) {
        projects = projects.filter(item => item.id !== id);
        if (selectedFolderId === id) { selectedFolderId = null; selectedFileId = null; }
        saveState();
      }
    }

    /* ---------------- 마감 목록 렌더링 (D-Day 임박 순 정렬) ---------------- */
    function renderProjects() {
      const container = document.getElementById('projectList');
      container.innerHTML = '';

      const now = new Date();
      const todayDate = new Date(now.getFullYear(), now.getMonth(), now.getDate(), 0, 0, 0);

      // 마감 임박 순(D-Day 오름차순)으로 정렬하여 표시
      const sortedProjects = [...projects].sort((a, b) => {
        const getDiff = (proj) => {
          if (!proj.dueDate) return Infinity; // 마감일 없는 항목은 맨 뒤로
          const [y, m, d] = proj.dueDate.split('-').map(Number);
          const target = new Date(y, m - 1, d, 0, 0, 0);
          return Math.round((target - todayDate) / (1000 * 60 * 60 * 24));
        };
        return getDiff(a) - getDiff(b);
      });

      sortedProjects.forEach(p => {
        const currentEp = p.currentEpisode || 1;
        const currentEpChars = p.logs.filter(l => (p.type === '단편' || l.episode === currentEp)).reduce((sum, l) => sum + l.chars, 0);
        const rate = Math.min(100, (currentEpChars / p.targetChars) * 100 || 0).toFixed(1);
        
        let dday = '기한 없음';
        if (p.dueDate) {
          const [tY, tM, tD] = p.dueDate.split('-').map(Number);
          const targetDate = new Date(tY, tM - 1, tD, 0, 0, 0);
          const diff = Math.round((targetDate - todayDate) / (1000 * 60 * 60 * 24));
          dday = diff === 0 ? 'D-Day' : (diff < 0 ? `D+${Math.abs(diff)}` : `D-${diff}`);
        }

        let epInfo = '';
        if (p.type === '장편(주기형)') {
          epInfo = ` ${p.currentEpisode || 1}/${p.finalEpisode || '?'}화`;
        } else if (p.type === '장편(자유형)') {
          epInfo = ` ${p.currentEpisode || 1}화`;
        }

        const card = document.createElement('div');
        card.className = `project-card ${p.isUploaded ? 'uploaded' : ''}`;
        card.style.borderLeftColor = p.color;
        card.innerHTML = `
          <div class="card-top">
            <div>
              <span class="badge" style="background:${p.color}">${p.type}${epInfo}</span>
              <strong style="margin-left:4px;">${p.title}</strong>
            </div>
            <label class="toggle-switch">
              <input type="checkbox" ${p.isUploaded ? 'checked' : ''} onchange="toggleUpload(${p.id})">
              <span>${p.isUploaded ? '업로드 완료' : '미완료'}</span>
            </label>
          </div>

          <div style="display:flex; justify-content:space-between; font-size:0.75rem; color:var(--text-muted);">
            <span>마감일: ${p.dueDate || '미정'} (${dday})</span>
            <span>${currentEpChars.toLocaleString()} / ${p.targetChars.toLocaleString()}자 (${rate}%)</span>
          </div>

          <div style="display:flex; justify-content:flex-end; gap:0.4rem; margin-top:2px;">
            <button class="btn-sm" onclick="openProjectModal(${p.id})">수정</button>
            <button class="btn-sm btn-danger" onclick="deleteProject(${p.id})">삭제</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    /* ---------------- 캘린더 렌더링 ---------------- */
    function changeMonth(delta) {
      calDate.setMonth(calDate.getMonth() + delta);
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarGrid');
      grid.innerHTML = '';

      const y = calDate.getFullYear();
      const m = calDate.getMonth();
      document.getElementById('calTitle').innerText = `${y}년 ${m + 1}월`;

      ['일','월','화','수','목','금','토'].forEach(d => {
        grid.innerHTML += `<div class="cal-day-name">${d}</div>`;
      });

      const firstDay = new Date(y, m, 1).getDay();
      const lastDate = new Date(y, m + 1, 0).getDate();
      
      const now = new Date();
      const todayStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;

      for (let i = 0; i < firstDay; i++) grid.innerHTML += `<div></div>`;

      let todaySum = 0;

      for (let d = 1; d <= lastDate; d++) {
        const dateStr = `${y}-${String(m + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
        let tagsHtml = '';

        projects.forEach(p => {
          const dayLogs = p.logs.filter(log => log.date === dateStr);
          const dayChars = dayLogs.reduce((sum, log) => sum + log.chars, 0);
          if (dayChars > 0) {
            tagsHtml += `<div class="cal-tag" style="background:${p.color}">+${dayChars}자</div>`;
            if (dateStr === todayStr) todaySum += dayChars;
          }

          if (p.type !== '장편(주기형)' && p.dueDate === dateStr) {
            tagsHtml += `<div class="cal-tag" style="background:${p.color}; outline:1px solid #000;">[마감] ${p.title}</div>`;
          }

          if (p.type === '장편(주기형)' && p.schedule) {
            p.schedule.forEach(sch => {
              if (sch.dueDate === dateStr) {
                tagsHtml += `<div class="cal-tag" style="background:${p.color}; outline:1px solid #000;">[${sch.episode}화] ${p.title}</div>`;
              }
            });
          }
        });

        grid.innerHTML += `
          <div class="cal-cell ${dateStr === todayStr ? 'today' : ''}">
            <span>${d}</span>
            <div class="cal-tags">${tagsHtml}</div>
          </div>
        `;
      }

      document.getElementById('todayCharSum').innerText = todaySum.toLocaleString();
    }

    /* ---------------- 콘티 탐색기 ---------------- */
    function renderExplorer() {
      const tree = document.getElementById('treeView');
      const files = document.getElementById('fileList');
      tree.innerHTML = '';
      files.innerHTML = '';

      if (projects.length === 0) {
        document.getElementById('currentEditingPath').innerText = '생성된 프로젝트가 없습니다.';
        document.getElementById('contiEditor').value = '';
        return;
      }

      if (!selectedFolderId || !projects.some(p => p.id === selectedFolderId)) {
        selectedFolderId = projects[0].id;
      }

      projects.forEach(p => {
        const item = document.createElement('div');
        item.className = `tree-item ${p.id === selectedFolderId ? 'active' : ''}`;
        item.innerHTML = `📁 ${p.title}`;
        item.onclick = () => { selectedFolderId = p.id; selectedFileId = null; renderExplorer(); };
        tree.appendChild(item);
      });

      const currentProj = projects.find(p => p.id === selectedFolderId);
      if (currentProj) {
        if (!currentProj.files) currentProj.files = [];
        if (currentProj.files.length > 0 && !selectedFileId) {
          selectedFileId = currentProj.files[0].id;
        }

        currentProj.files.forEach(f => {
          const fItem = document.createElement('div');
          fItem.className = `file-item ${f.id === selectedFileId ? 'active' : ''}`;
          fItem.innerHTML = `📄 ${f.name}`;
          fItem.onclick = () => { selectedFileId = f.id; renderExplorer(); };
          files.appendChild(fItem);
        });

        const currentFile = currentProj.files.find(f => f.id === selectedFileId);
        if (currentFile) {
          document.getElementById('currentEditingPath').innerText = `${currentProj.title} > ${currentFile.name}`;
          document.getElementById('contiEditor').value = currentFile.content || '';
        } else {
          document.getElementById('currentEditingPath').innerText = '선택된 파일이 없습니다.';
          document.getElementById('contiEditor').value = '';
        }
      }
    }

    function createContiFile() {
      if (!selectedFolderId) return;
      const name = prompt('생성할 콘티 파일명을 입력하십시오:', '새콘티.txt');
      if (!name) return;

      const p = projects.find(item => item.id === selectedFolderId);
      const newFile = { id: Date.now(), name, content: '' };
      p.files.push(newFile);
      selectedFileId = newFile.id;
      saveState();
    }

    function deleteContiFile() {
      if (!selectedFolderId || !selectedFileId) return;
      const p = projects.find(item => item.id === selectedFolderId);
      if (confirm('선택한 파일을 삭제하시겠습니까?')) {
        p.files = p.files.filter(f => f.id !== selectedFileId);
        selectedFileId = null;
        saveState();
      }
    }

    document.getElementById('contiEditor').addEventListener('input', (e) => {
      if (!selectedFolderId || !selectedFileId) return;
      const p = projects.find(item => item.id === selectedFolderId);
      const f = p.files.find(file => file.id === selectedFileId);
      if (f) {
        f.content = e.target.value;
        localStorage.setItem('writer_board_data', JSON.stringify(projects));
      }
    });

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(projects));
      const a = document.createElement('a');
      a.setAttribute("href", dataStr);
      a.setAttribute("download", `마감보드_백업_${new Date().toISOString().slice(0,10)}.json`);
      a.click();
    }

    function importData() {
      document.getElementById('fileInput').click();
    }

    function handleFile(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (event) => {
        try {
          projects = JSON.parse(event.target.result);
          saveState();
          alert('데이터를 성공적으로 복원했습니다.');
        } catch (err) {
          alert('올바른 JSON 백업 파일이 아닙니다.');
        }
      };
      reader.readAsText(file);
    }

    window.onload = function() {
      initResizers();
      setInterval(updateClock, 1000);
      updateClock();
      renderAll();
    };
  </script>
